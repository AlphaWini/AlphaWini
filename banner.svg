<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AIphaWini: From PLC to LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2540" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif}
    .trace{fill:none;stroke:#1e3a5f;stroke-width:2}
    .pulse{fill:none;stroke:url(#ai);stroke-width:3;stroke-linecap:round;stroke-dasharray:46 700;stroke-dashoffset:746;animation:run 3.6s linear infinite}
    .r{animation-direction:reverse}
    .d1{animation-delay:-1.2s}.d2{animation-delay:-2.4s}
    @keyframes run{to{stroke-dashoffset:0}}
    .halo{animation:breathe 4s ease-in-out infinite alternate;transform-origin:600px 150px}
    @keyframes breathe{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1.06)}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .led{animation:led 1.6s ease-in-out infinite alternate}
    .led2{animation-delay:-.8s}
    @keyframes led{from{opacity:.25}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.pulse,.halo,.cursor,.led{animation:none}}
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <ellipse class="halo" cx="600" cy="150" rx="330" ry="130" fill="url(#halo)"/>

  <!-- PLC side -->
  <path class="trace" d="M0 70 H110 L150 115 H230"/>
  <path class="trace" d="M0 150 H230"/>
  <path class="trace" d="M0 230 H90 L130 185 H230"/>
  <path class="pulse" filter="url(#glow)" d="M0 70 H110 L150 115 H230"/>
  <path class="pulse d1" filter="url(#glow)" d="M0 150 H230"/>
  <path class="pulse d2" filter="url(#glow)" d="M0 230 H90 L130 185 H230"/>
  <rect x="230" y="100" width="84" height="100" rx="10" fill="#0d1428" stroke="#22d3ee" stroke-width="2"/>
  <circle class="led" cx="250" cy="116" r="4" fill="#22d3ee"/>
  <circle class="led led2" cx="264" cy="116" r="4" fill="#22d3ee"/>
  <text class="t" x="272" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#22d3ee">PLC</text>

  <!-- LLM side -->
  <path class="trace" d="M886 115 H1050 L1090 70 H1200"/>
  <path class="trace" d="M886 150 H1200"/>
  <path class="trace" d="M886 185 H1070 L1110 230 H1200"/>
  <path class="pulse r" filter="url(#glow)" d="M886 115 H1050 L1090 70 H1200"/>
  <path class="pulse r d1" filter="url(#glow)" d="M886 150 H1200"/>
  <path class="pulse r d2" filter="url(#glow)" d="M886 185 H1070 L1110 230 H1200"/>
  <rect x="886" y="100" width="84" height="100" rx="10" fill="#0d1428" stroke="#a855f7" stroke-width="2"/>
  <circle class="led" cx="906" cy="116" r="4" fill="#a855f7"/>
  <circle class="led led2" cx="920" cy="116" r="4" fill="#a855f7"/>
  <text class="t" x="928" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#a855f7">LLM</text>

  <!-- Name -->
  <text class="t" x="600" y="148" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="1" fill="#f8fafc"><tspan fill="url(#ai)">AI</tspan>phaWini</text>
  <text class="t" x="600" y="196" text-anchor="middle" font-size="26" font-weight="600" fill="#94a3b8">From <tspan fill="#22d3ee">PLC</tspan> to <tspan fill="#a855f7">LLM</tspan></text>
  <text class="t" x="600" y="242" text-anchor="middle" font-size="19" fill="#cbd5e1" font-style="italic">If it repeats, I automate it.<tspan class="cursor" fill="#22d3ee" font-style="normal"> ▍</tspan></text>
</svg>
